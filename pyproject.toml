[project]
name = "pinote"
version = "0.1.0"
description = "Persistent desktop reminders with a small CLI and durable history"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/kvidzibo/pinote"
Issues = "https://github.com/kvidzibo/pinote/issues"

[project.scripts]
note = "pinote.cli:main"
pinote-gui = "pinote.gui:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv.build-backend]
source-include = ["docs/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: isolated desktop integration (requires xvfb-run and a private D-Bus session)",
    "gtk: optional GTK frontend integration (requires Debian-Python GUI environment)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
