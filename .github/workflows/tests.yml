name: tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
        # Keep required check names: shard 1 runs the long engine scenario alone,
        # shard 2 runs every other file.
        shard: [1, 2]
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: pi/package-lock.json
      - run: npm --prefix backend ci --ignore-scripts --no-audit --no-fund && npm --prefix backend run build
        working-directory: .
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Test engine scenario
        if: matrix.shard == 1
        run: node --test --experimental-strip-types tests/engine.test.ts
      - name: Test remaining files
        if: matrix.shard == 2
        run: >-
          node --test --experimental-strip-types
          $(ls tests/*.test.ts test-load.ts | grep -vx tests/engine.test.ts)
      - run: npm pack --dry-run --ignore-scripts
        if: matrix.shard == 1

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - run: npm --prefix backend ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix backend run check && npm --prefix backend run build && npm --prefix backend test
      - run: npm --prefix backend run test:package

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y dunst dbus-x11 xvfb xauth
      - run: npm --prefix backend ci --ignore-scripts --no-audit --no-fund
      - run: xvfb-run -a npm --prefix backend run test:desktop

  electron:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        screen: ["1280x900x24", "800x600x24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install isolated desktop test prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          dbus-x11 xvfb xauth i3-wm xdotool imagemagick
          libgtk-3-0t64 libnss3 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64
          libcups2t64 libdrm2 libgbm1 libxcomposite1 libxdamage1 libxfixes3
          libxrandr2 libxkbcommon0
      - run: npm --prefix backend ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix electron ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix electron run setup
      - name: Provision Chromium SUID sandbox on ephemeral runner
        run: |
          sudo chown root:root electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 electron/node_modules/electron/dist/chrome-sandbox
      - name: Type and unit checks
        if: matrix.screen == '800x600x24'
        run: npm --prefix electron run check && npm --prefix electron test
      # The lifecycle sequence (part 1) and the independent workflow checks (part 2)
      # run concurrently, each on its own X server and private D-Bus session.
      - name: Isolated desktop checks
        working-directory: electron
        env:
          SCREEN: ${{ matrix.screen }}
        run: |
          npm run build
          run() { xvfb-run -n "$1" -s "-screen 0 $SCREEN" dbus-run-session -- sh -c "$2" > "$RUNNER_TEMP/e2e-$1.log" 2>&1; }
          run 101 'node tests/e2e.mjs --part=1' & lifecycle=$!
          run 102 'node tests/backend-switch-e2e.mjs && node tests/watchers-e2e.mjs && node tests/e2e.mjs --part=2' & workflows=$!
          status=0
          wait "$lifecycle" || status=1
          wait "$workflows" || status=1
          for n in 101 102; do echo "--- e2e display :$n ---"; cat "$RUNNER_TEMP/e2e-$n.log"; done
          exit "$status"
      - run: npm --prefix electron run package
        if: matrix.screen == '1280x900x24'
      - name: Provision packaged sandbox on ephemeral runner
        if: matrix.screen == '1280x900x24'
        run: |
          sudo chown root:root electron/out/pinote-electron-linux-x64/chrome-sandbox
          sudo chmod 4755 electron/out/pinote-electron-linux-x64/chrome-sandbox
      - name: Isolated packaged application smoke test
        if: matrix.screen == '1280x900x24'
        run: >-
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session --
          npm --prefix electron run test:package
