name: tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gtk: ${{ steps.paths.outputs.gtk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Detect GTK and shared Python changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Release/reusable runs keep full coverage. PRs use their complete diff,
          # including deleted paths and both sides of renames.
          gtk=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --no-renames -z "$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/gtk-paths"
            gtk=false
            while IFS= read -r -d '' path; do
              case "$path" in
                src/*|tests/*|scripts/*|pyproject.toml|uv.lock|.github/*)
                  gtk=true
                  break
                  ;;
              esac
            done < "$RUNNER_TEMP/gtk-paths"
          fi
          echo "gtk=$gtk" >> "$GITHUB_OUTPUT"

  pi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.19.0", "24"]
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: pi/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --locked
        working-directory: .
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run

  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -m 'not gui'
      - run: uv build
      - name: Smoke-test built wheel in a clean environment
        run: |
          uv venv /tmp/pinote-smoke --python "${{ matrix.python }}"
          uv pip install --python /tmp/pinote-smoke/bin/python --no-deps dist/*.whl
          export XDG_DATA_HOME="$(mktemp -d)" XDG_STATE_HOME="$(mktemp -d)"
          /tmp/pinote-smoke/bin/note --no-notify "wheel smoke test"
          /tmp/pinote-smoke/bin/note done 1 --no-notify
          /tmp/pinote-smoke/bin/note history 1
          /tmp/pinote-smoke/bin/pinote-gui --help
          /tmp/pinote-smoke/bin/python -c 'from importlib.resources import files; assert files("pinote.gui").joinpath("style.css").is_file()'

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: sudo apt-get update && sudo apt-get install -y dunst dbus-x11 xvfb xauth
      - run: uv sync --locked --python 3.13
      - run: xvfb-run -a dbus-run-session -- uv run pytest -m 'gui and not gtk' --run-gui

  gtk:
    needs: changes
    if: needs.changes.outputs.gtk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          python3-gi gir1.2-gtk-3.0 dbus-x11 xvfb xauth xdotool i3-wm
      - run: uv venv --python /usr/bin/python3 --system-site-packages .venv-gui
      - run: uv build
      - run: |
          for wheel in dist/*.whl; do
            uv pip install --python .venv-gui/bin/python "$wheel[gui]" --group dev
          done
      - run: xvfb-run -a -s '-screen 0 2560x1440x24' dbus-run-session -- .venv-gui/bin/python -m pytest -m gtk --run-gui
      - name: Small-display placement and reopen
        run: >-
          xvfb-run -a dbus-run-session -- .venv-gui/bin/python -m pytest tests/test_gtk.py
          -k 'compact_ or i3_honors or single_instance_reopen or error_notice_keeps or manual_position' --run-gui

  electron:
    runs-on: ubuntu-latest
    env:
      PINOTE_ELECTRON_BACKEND: ${{ github.workspace }}/.venv/bin/pinote-electron-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - name: Install isolated desktop test prerequisites
        run: >-
          sudo apt-get update && sudo apt-get install -y
          dbus-x11 xvfb xauth i3-wm xdotool imagemagick python3-gi gir1.2-gtk-3.0
          libgtk-3-0t64 libnss3 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64
          libcups2t64 libdrm2 libgbm1 libxcomposite1 libxdamage1 libxfixes3
          libxrandr2 libxkbcommon0
      - run: uv sync --locked --python 3.13
      - run: uv venv --python /usr/bin/python3 --system-site-packages .venv-gui
      - run: uv pip install --python .venv-gui/bin/python -e '.[gui]'
      - run: npm --prefix pi ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix pi run build:mcp
      - run: npm --prefix electron ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix electron run setup
      - name: Provision Chromium SUID sandbox on ephemeral runner
        run: |
          sudo chown root:root electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 electron/node_modules/electron/dist/chrome-sandbox
      - name: Type, unit, and isolated desktop checks
        run: >-
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- sh -c
          'npm --prefix electron run check && npm --prefix electron test && npm --prefix electron run test:e2e'
      - name: Small-display Electron checks
        run: >-
          xvfb-run -a -s '-screen 0 800x600x24' dbus-run-session --
          npm --prefix electron run test:e2e
      - run: npm --prefix electron run build
      - run: npm --prefix electron run package
      - name: Provision packaged sandbox on ephemeral runner
        run: |
          sudo chown root:root electron/out/pinote-electron-linux-x64/chrome-sandbox
          sudo chmod 4755 electron/out/pinote-electron-linux-x64/chrome-sandbox
      - name: Isolated packaged application smoke test
        run: >-
          xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session --
          npm --prefix electron run test:package
